name: test

on: [push, pull_request]

jobs:
  test:
    name: Node v${{ matrix.node }} on PostgreSQL v${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        postgres: ['13', '14', '15', '16', '17', '18']
    # Pinned, so that a new image behind ubuntu-latest can't break the steps below unannounced
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          date
          sudo apt-get purge -y 'postgresql-*' || true
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get -y install "postgresql-${{ matrix.postgres }}"
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - name: Install pg_tmp, which the tests start their PostgreSQL servers with
        run: |
          git clone https://github.com/ludios/ephemeralpg "$RUNNER_TEMP/ephemeralpg"
          git -C "$RUNNER_TEMP/ephemeralpg" checkout fec6ffb97bb902e8caef0fd9ab880ccf115db83a
          make -C "$RUNNER_TEMP/ephemeralpg"
          sudo make -C "$RUNNER_TEMP/ephemeralpg" install
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The tests use src/, so skip `prepare`, which builds dist/
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Run the simulation against dist/, which `pnpm install` built
        run: MODULE=../dist/index.js node tests/simulate.ts
